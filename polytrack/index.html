    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-TW2VBSRKFT");
    </script>
    <link
      rel="preload"
      href="forced_square.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="images/logo.svg"

      type="image/svg+xml"
    />
    <link

      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <script>
      window.polytrackModConfiguration = {
        unblocked: true,
        modName: "PolyUnblocked",
        author: "Unblocker",
      };
    </script>
    <script defer="defer" src="error_screen.bundle.js"></script>
    <script type="module">
      // Wait for the Supabase bridge to finish loading before PolyTrack starts
      // making leaderboard requests; otherwise the first requests can escape interception.
      (async () => {
        try {
          await import("./supabase-backend.js?v=20261027-15");
        } catch (error) {
          console.error("PolyTrack Supabase bridge failed to load:", error);
        }
        const loadScript = src => new Promise(resolve => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = () => resolve(true);
          script.onerror = () => { console.error("Failed to load " + src); resolve(false); };
          document.head.appendChild(script);
        });
        await loadScript("main.bundle.js?v=20261027-15");
        await loadScript("carson-tracks.js?v=20261027-16");
      })();
    </script>
    <script src="/assets/theme-loader.js"></script>
  <title>Dashboard | RapidIdentity</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
</head>
  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>
  </body>
