<!doctype html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <title>Dashboard | RapidIdentity</title>
  <style>
    /* Reset margins and force full viewport height */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Scale game canvas container responsively */
    #logo {
      width: 554px;
      height: 186px;
      background: black url(pacman10-hp.png) 0 0 no-repeat;
      position: relative;
      transform: scale(2); /* Doubles the size for modern high-res screens */
      transform-origin: center center;
    }

    /* Adjust scale automatically on small screens so it never overflows */
    @media (max-width: 1200px) {
      #logo {
        transform: scale(1.5);
      }
    }

    @media (max-width: 800px) {
      #logo {
        transform: scale(1);
      }
    }
  </style>

  <script>
    window.google = {
      time: function () {
        return (new Date).getTime()
      },
      Toolbelt: {},
      y: {},
      dstr: [],
      rein: []
    }
  </script>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
</head>
<body>

  <div id="logo" title="PAC-MAN">
    <div id="logo-l" style="width:200px;height:2px;left:177px;top:157px;background:#990;position:absolute;display:none;overflow:hidden">
      <div id="logo-b" style="position:absolute;left:0;background:#ff0;height:8px;width:0"></div>
    </div>
  </div>

  <script src='google-script.js'></script>
  <script>
    google.neegg = 1;

    google.pml = function () {
      function d(a) {
        if (!google.pml_installed) {
          google.pml_installed = true;
          if (!a) {
              document.getElementById("logo").style.background = "black";
              window.setTimeout(function () {
                  var b = document.getElementById("logo-l");
                  if (b) b.style.display = "block"
              }, 400)
          }
          var audio = document.createElement("script");
          audio.type = "text/javascript";
          audio.src = "pacman-audio.js";
          audio.onload = function () {
            var s = document.createElement("script");
            s.type = "text/javascript";
            s.src = "pacman.js";
            google.dom.append(s)
          };
          google.dom.append(audio)
        }
      }
      function e() {
        if (document.f && document.f.btnI) document.f.btnI.onclick = function () {
          if (typeof google.pacman != "undefined") google.pacman.insertCoin();
          else {
            google.pacManSound = true;
            d(false)
          }
          return false
        }
      }
      if (!google.pml_loaded) {
        google.pml_loaded = true;
        window.setTimeout(function () {
          d(true)
        }, 1E3);
        e();
        google.rein && google.rein.push(e);
        google.dstr && google.dstr.push(function () {
          google.pacman && google.pacman.destroy();
          if (google.pml_installed) {
              google.pml_installed = false
          }
        });
        google.pacManQuery = function () {
          return false
        }
      }
    };

    google.pml && google.pml();
  </script>
</body>
</html>
