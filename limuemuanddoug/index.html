<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limu Emu & Doug Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf5ff;font-family:Arial,sans-serif;color:#123}
#game{max-width:900px;margin:auto;padding:18px}
h1{text-align:center;margin:5px 0 12px;color:#1769aa}
#top{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;background:white;padding:12px;border-radius:14px;box-shadow:0 3px 12px #0002}
.stat{font-weight:bold}.bar{height:10px;background:#ddd;border-radius:10px;overflow:hidden;width:130px;display:inline-block;vertical-align:middle}.fill{height:100%;background:#28a745;width:50%}
canvas{display:block;width:100%;height:auto;margin:14px 0;background:#8ed0ff;border:4px solid #1769aa;border-radius:15px}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:10px;padding:11px 15px;background:#1769aa;color:white;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.97)}
#log{background:white;margin-top:12px;padding:12px;border-radius:12px;min-height:50px}
.small{font-size:13px;color:#456;text-align:center}
</style>
</head>
<body>
<div id="game">
<h1>🦅 Limu Emu & Doug Simulator</h1>
<div id="top">
 <div class="stat">Money: $<span id="money">100</span></div>
 <div class="stat">Energy: <span class="bar"><span id="energy" class="fill"></span></span></div>
 <div class="stat">Reputation: <span id="rep">0</span></div>
 <div class="stat">Day: <span id="day">1</span></div>
</div>
<canvas id="c" width="860" height="430"></canvas>
<div id="controls">
 <button onclick="mission()">📢 Sell Insurance</button>
 <button onclick="drive()">🚗 Drive Around</button>
 <button onclick="feed()">🍗 Feed Limu</button>
 <button onclick="rest()">💤 Rest</button>
 <button onclick="randomEvent()">🎲 Random Event</button>
</div>
<div id="log">Welcome to the simulator! Help Limu and Doug become the most famous insurance duo around.</div>
<p class="small">Fan-made parody game. Static HTML — no server required.</p>
</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let money=100,energy=100,rep=0,day=1,px=100,dir=1,t=0;

function ui(){
 document.getElementById("money").textContent=Math.max(0,Math.floor(money));
 document.getElementById("rep").textContent=rep;
 document.getElementById("day").textContent=day;
 document.getElementById("energy").style.width=Math.max(0,energy)+"%";
}
function msg(s){document.getElementById("log").textContent=s;ui()}
function spend(n){if(energy<n){msg("Limu is exhausted! Let the team rest.");return false}energy-=n;return true}

function mission(){
 if(!spend(12))return;
 let gain=15+Math.floor(Math.random()*36);
 if(Math.random()<.15){gain+=50;rep+=4;msg("Huge win! Limu impressed everyone and Doug closed the deal. +$"+gain+" and +4 reputation!")}
 else{rep+=1;msg("Mission complete! Doug handled the paperwork while Limu did the dramatic entrance. +$"+gain+" and +1 reputation.");}
 money+=gain; day++;ui();
}
function drive(){
 if(!spend(18))return;
 let gain=5+Math.floor(Math.random()*20);money+=gain;day++;
 msg("Road trip complete. Limu spotted a suspiciously large sandwich. +$"+gain);ui();
}
function feed(){
 if(money<8){msg("You need $8 to buy Limu a snack.");return}
 money-=8;energy=Math.min(100,energy+25);
 msg("Limu received an extremely important snack. Energy restored!");ui();
}
function rest(){
 energy=Math.min(100,energy+45);day++;
 msg("The team took a well-earned break. Energy restored.");ui();
}
function randomEvent(){
 if(!spend(5))return;
 let r=Math.random();
 if(r<.33){money+=30;rep+=2;msg("A crowd recognized Limu! +$30 and +2 reputation.")}
 else if(r<.66){money=Math.max(0,money-20);msg("Doug accidentally paid for 20 gallons of birdseed. -$20.")}
 else{energy=Math.min(100,energy+35);rep+=3;msg("Limu gave an inspirational emu speech. +3 reputation and energy boost!")}
 day++;ui();
}

function draw(){
 t+=.04;x.clearRect(0,0,c.width,c.height);
 // sky
 x.fillStyle="#8ed0ff";x.fillRect(0,0,c.width,c.height);
 // clouds
 x.fillStyle="#fff";for(let i=0;i<5;i++){let cx=(i*190+t*12)%980-60; x.beginPath();x.arc(cx,70,25,0,7);x.arc(cx+30,65,32,0,7);x.arc(cx+62,75,22,0,7);x.fill()}
 // road
 x.fillStyle="#555";x.fillRect(0,300,c.width,130);
 x.fillStyle="#ffd84d";for(let i=0;i<12;i++)x.fillRect(i*90-((t*70)%90),358,45,6);
 // car
 x.fillStyle="#1769aa";x.fillRect(560,255,190,55);x.fillRect(595,225,105,45);
 x.fillStyle="#bde7ff";x.fillRect(610,232,35,30);x.fillRect(652,232,35,30);
 x.fillStyle="#222";x.beginPath();x.arc(600,310,22,0,7);x.arc(710,310,22,0,7);x.fill();
 // Doug
 x.fillStyle="#f0b27a";x.beginPath();x.arc(470,180,32,0,7);x.fill();
 x.fillStyle="#222";x.fillRect(440,146,60,15);
 x.fillStyle="#2f80c0";x.fillRect(440,212,62,90);
 x.fillStyle="#222";x.fillRect(447,300,18,45);x.fillRect(480,300,18,45);
 x.fillStyle="#fff";x.font="bold 18px Arial";x.fillText("DOUG",451,252);
 // Limu
 px+=dir*.45;if(px>360||px<80)dir*=-1;
 let lx=px,ly=275;
 x.fillStyle="#a87845";x.beginPath();x.ellipse(lx,ly,52,30,0,0,7);x.fill();
 x.beginPath();x.arc(lx+43,ly-27,25,0,7);x.fill();
 x.fillStyle="#e8c18b";x.beginPath();x.moveTo(lx+60,ly-28);x.lineTo(lx+92,ly-18);x.lineTo(lx+60,ly-10);x.fill();
 x.fillStyle="#fff";x.beginPath();x.arc(lx+49,ly-35,8,0,7);x.fill();
 x.fillStyle="#111";x.beginPath();x.arc(lx+52,ly-35,3,0,7);x.fill();
 // speech bubble
 x.fillStyle="#fff";x.strokeStyle="#1769aa";x.lineWidth=3;x.beginPath();x.roundRect(55,30,330,70,14);x.fill();x.stroke();
 x.fillStyle="#123";x.font="bold 18px Arial";x.fillText(rep>10?"WE'RE ON FIRE!":"LET'S SELL SOME INSURANCE!",75,72);
 requestAnimationFrame(draw);
}
ui();draw();
</script>
</body>
</html>
