<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/centerclassroom/salam@main/style.css" />
    <style>
        canvas:focus {
            outline: none;
        }

        /* Mobile-only controls; the rest of the screen remains available for camera touch. */
        #mobile-controls{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;font-family:Arial,sans-serif}
        #mobile-controls.active{display:block}
        #move-stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(18,24,34,.34);border:2px solid rgba(255,255,255,.42);box-shadow:0 4px 18px #0005;pointer-events:auto;touch-action:none}
        #move-stick:after{content:"";position:absolute;inset:35px;border:1px solid rgba(255,255,255,.22);border-radius:50%}
        #stick-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(235,242,255,.86);border:1px solid #fff;box-shadow:0 2px 8px #0006;pointer-events:none;transform:translate(0,0)}
        #jump-button{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(38px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(55,130,245,.72);color:#fff;font-size:14px;font-weight:800;letter-spacing:.4px;text-shadow:0 1px 3px #000;box-shadow:0 4px 18px #0005;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
        #jump-button:active{background:rgba(35,105,220,.95);transform:scale(.96)}
        @media(orientation:landscape){#move-stick{width:120px;height:120px}#jump-button{width:82px;height:82px;bottom:max(24px,env(safe-area-inset-bottom))}}
        @media(pointer:fine){#mobile-controls{display:none!important}}

        html,
        body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            height: 100%;
        }
    </style>
<script type="module" src="https://ineedsomemorelapeace.github.io/games/assets/chat-notifications.js"></script>
</head>

<body class="dark">
    <div id="unity-container" class="unity-desktop"> <canvas id="unity-canvas" tabindex="-1"></canvas> </div>
    <div id="mobile-controls" aria-hidden="true">
        <div id="move-stick" aria-label="Movement joystick"><div id="stick-knob"></div></div>
        <button id="jump-button" type="button">JUMP</button>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="https://cdn.jsdelivr.net/gh/greeniYT/gug@main/icons/chickenend.png" /></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>
    <script>
        const hideFullScreenButton = "";
        const buildUrl = "https://cdn.jsdelivr.net/gh/centerclassroom/salam@main/Build";
        const loaderUrl = buildUrl + "/Build.loader.js";
        const config = {
            dataUrl: buildUrl + "/Build.data.unityweb",
            frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
            codeUrl: buildUrl + "/Build.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Chicken",
            productName: "Chicken",
            productVersion: "1.0.2"
        };
        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');
        const mobileControls = document.querySelector("#mobile-controls");
        const moveStick = document.querySelector("#move-stick");
        const stickKnob = document.querySelector("#stick-knob");
        const jumpButton = document.querySelector("#jump-button");
        const touchDevice = matchMedia("(pointer: coarse)").matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const heldKeys = new Set();

        // Dispatch once from the canvas so the event bubbles through Unity's normal input listeners.
        function setVirtualKey(key, down) {
            if (heldKeys.has(key) === down) return;
            if (down) heldKeys.add(key); else heldKeys.delete(key);
            const code = key === " " ? "Space" : "Key" + key.toUpperCase();
            canvas.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", {
                key, code, bubbles: true, cancelable: true
            }));
        }

        function releaseMovement() {
            ["w","a","s","d"].forEach(key => setVirtualKey(key, false));
            stickKnob.style.transform = "translate(0,0)";
        }

        let stickPointerId = null;
        function moveJoystick(event) {
            const rect = moveStick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = event.clientX - centerX;
            let dy = event.clientY - centerY;
            const limit = rect.width * 0.34;
            const distance = Math.hypot(dx, dy);
            if (distance > limit) {
                dx = dx / distance * limit;
                dy = dy / distance * limit;
            }
            stickKnob.style.transform = "translate(" + dx + "px," + dy + "px)";
            const threshold = limit * 0.28;
            const next = new Set();
            if (dy < -threshold) next.add("w");
            if (dy > threshold) next.add("s");
            if (dx < -threshold) next.add("a");
            if (dx > threshold) next.add("d");
            ["w","a","s","d"].forEach(key => setVirtualKey(key, next.has(key)));
        }

        if (touchDevice) {
            moveStick.addEventListener("pointerdown", event => {
                event.preventDefault();
                stickPointerId = event.pointerId;
                moveStick.setPointerCapture(event.pointerId);
                moveJoystick(event);
            });
            moveStick.addEventListener("pointermove", event => {
                if (event.pointerId === stickPointerId) {
                    event.preventDefault();
                    moveJoystick(event);
                }
            });
            const endStick = event => {
                if (stickPointerId !== null && (event.pointerId === undefined || event.pointerId === stickPointerId)) {
                    stickPointerId = null;
                    releaseMovement();
                }
            };
            moveStick.addEventListener("pointerup", endStick);
            moveStick.addEventListener("pointercancel", endStick);
            moveStick.addEventListener("lostpointercapture", endStick);

            jumpButton.addEventListener("pointerdown", event => {
                event.preventDefault();
                jumpButton.setPointerCapture(event.pointerId);
                setVirtualKey(" ", true);
            });
            const endJump = () => setVirtualKey(" ", false);
            jumpButton.addEventListener("pointerup", endJump);
            jumpButton.addEventListener("pointercancel", endJump);
            jumpButton.addEventListener("lostpointercapture", endJump);
            window.addEventListener("blur", () => {
                stickPointerId = null;
                releaseMovement();
                endJump();
            });
        }
        const canFullscreen = (function() {
            for (const key of ['exitFullscreen', 'webkitExitFullscreen', 'webkitCancelFullScreen', 'mozCancelFullScreen', 'msExitFullscreen', ]) {
                if (key in document) {
                    return true;
                }
            }
            return false;
        }());
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
        }
        canvas.style.background = "url('https://cdn.jsdelivr.net/gh/centerclassroom/salam@main/background.jpg') center / cover";
        loadingCover.style.display = "";
        document.addEventListener('contextmenu', event => event.preventDefault());
        function FocusGame() {
            window.focus();
            canvas.focus();
        }
        window.addEventListener('pointerdown', FocusGame);
        window.addEventListener('touchstart', FocusGame);
        let StartUnityInstance;
        let myGameInstance;
        let ysdk = null;
        let environmentData = {
            language: "en",
            domain: "default_domain",
            deviceType: "desktop",
            isMobile: false,
            isDesktop: true,
            isTablet: false,
            isTV: false,
            appID: "default_app_id",
            browserLang: navigator.language || "en",
            payload: null,
            promptCanShow: false,
            reviewCanShow: false,
            platform: navigator.platform,
            browser: (function() {
                let userAgent = navigator.userAgent;
                if (userAgent.includes("YaBrowser")) return "Yandex";
                if (userAgent.includes("OPR") || userAgent.includes("Opera")) return "Opera";
                if (userAgent.includes("Firefox")) return "Firefox";
                if (userAgent.includes("MSIE") || userAgent.includes("Trident")) return "IE";
                if (userAgent.includes("Edge")) return "Edge";
                if (userAgent.includes("Chrome")) return "Chrome";
                if (userAgent.includes("Safari")) return "Safari";
                return "Other";
            })()
        };
        let cloudSaves = 'noData';
        let paymentsData = 'none';
        let playerData = 'noData';
        let player = null;
        let payments = null;
        let initGame = false;
        let nowFullAdOpen = false;
        function GetPayments() {
            console.warn("GetPayments is not implemented");
            return Promise.resolve("none");
        }
        function SaveCloud() {
            console.warn("SaveCloud is not implemented");
        }
        function LoadCloud() {
            console.warn("LoadCloud is not implemented");
            return Promise.resolve("noData");
        }
        function InitLeaderboard() {
            console.warn("InitPlayer is not implemented");
            return Promise.resolve("noData");
        }
        function FullAdShow() {
            try {
                if (!nowFullAdOpen) {
                    nowFullAdOpen = true;
                    if (initGame) {
                        myGameInstance.SendMessage("YandexGame", "OpenFullAd");
                    }
                    setTimeout(() => {
                        nowFullAdOpen = false;
                        if (initGame) {
                            myGameInstance.SendMessage("YandexGame", "CloseFullAd", "true");
                        }
                        FocusGame();
                    }, 500);
                }
            } catch (error) {}
        }
        function RewardedShow(rewardId) {
            try {
                myGameInstance.SendMessage("YandexGame", "RewardVideo", rewardId);
                function closeRewardedAd() {
                    myGameInstance.SendMessage("YandexGame", "CloseRewardVideo");
                    FocusGame();
                }
                closeRewardedAd();
            } catch (error) {}
        }
        function StickyAdActivity() {
            console.warn("StickyAdActivity is not implemented");
        }
        function Review() {
            console.warn("Review is not implemented");
        }
        function PromptShow() {
            console.warn("PromptShow is not implemented");
        }
        function InitLeaderboards() {
            console.warn("InitLeaderboards is not implemented");
        }
        function GetLeaderboardScores() {
            console.warn("GetLeaderboardScores is not implemented");
        }
        function SetLeaderboardScores() {
            console.warn("SetLeaderboardScores is not implemented");
        }
        function ConsumePurchase() {
            console.warn("ConsumePurchase is not implemented");
        }
        function ConsumePurchases() {
            console.warn("ConsumePurchases is not implemented");
        }
        try {
            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                StartUnityInstance = function () {
                    createUnityInstance(canvas, config, (progress) => {
                        spinner.style.display = "none";
                        progressBarEmpty.style.display = "";
                        progressBarFull.style.width = `${100 * progress}%`;
                    }).then((unityInstance) => {
                        myGameInstance = unityInstance;
                        loadingCover.style.display = "none";
                        if (touchDevice) mobileControls.classList.add("active");
                    }).catch((message) => {
                        console.error("Unity yükleme hatası:", message);
                    });
                };
                StartUnityInstance();
            };
            document.body.appendChild(script);
        } catch (error) {
            console.error("Başlatma sırasında hata:", error);
        }
        function InitGame() {
            try {
                console.log('Init Game Success');
                initGame = true;
                if (nowFullAdOpen === true && myGameInstance != null) {
                    myGameInstance.SendMessage('YandexGame', 'OpenFullAd');
                }
            } catch (error) {
                console.error("InitGame sırasında hata:", error);
            }
        }
        window.addEventListener("unhandledrejection", function(event) {
            console.warn("Hata es geçildi:", event.reason);
            event.preventDefault();
        });
    </script>
</body>

</html>
